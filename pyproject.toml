[project]
name = "code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arpit Kumar", email = "itsarpitgupta@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "docx2txt>=0.9",
    "faiss-cpu>=1.15.0",
    "langchain>=1.3.18",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.1",
    "langchain-experimental>=0.4.1",
    "langchain-google-genai>=4.4.0",
    "langchain-google-vertexai>=3.2.4",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.0",
    "pandas>=3.0.5",
    "pdfminer>=20191125",
    "pillow>=12.3.0",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.0",
    "tiktoken>=0.14.0",
    "unstructured>=0.27.5",
]

[project.scripts]
code = "code:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
