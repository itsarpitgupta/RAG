<svg viewBox="0 0 1200 680" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="1200" height="680" fill="#0D1117" rx="16"/>
  
  <!-- Header Title -->
  <text x="600" y="48" font-size="26" font-weight="700" text-anchor="middle" fill="#58A6FF" letter-spacing="1">DENSE VECTOR EMBEDDINGS &amp; SEMANTIC SEARCH PIPELINE</text>
  <text x="600" y="78" font-size="14" fill="#8B949E" text-anchor="middle">From Raw Text Tokens to High-Dimensional Latent Geometry &amp; Cosine Similarity Search</text>

  <!-- Markers -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58A6FF"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3FB950"/>
    </marker>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#21262D"/>
    </linearGradient>
    <linearGradient id="vector-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F6FEB"/>
      <stop offset="50%" stop-color="#8957E5"/>
      <stop offset="100%" stop-color="#3FB950"/>
    </linearGradient>
  </defs>

  <!-- STEP 1: Input Text -->
  <g transform="translate(40, 110)">
    <rect width="210" height="210" rx="12" fill="url(#grad1)" stroke="#30363D" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="38" rx="12" fill="#1F6FEB" fill-opacity="0.15"/>
    <text x="105" y="24" font-size="13" font-weight="600" text-anchor="middle" fill="#58A6FF">1. RAW TEXT / CHUNKS</text>
    
    <rect x="15" y="52" width="180" height="42" rx="6" fill="#0D1117" stroke="#30363D"/>
    <text x="25" y="70" font-size="11" fill="#7EE787">Doc 1:</text>
    <text x="25" y="86" font-size="11" fill="#C9D1D9">"Machine learning trains..."</text>
    
    <rect x="15" y="104" width="180" height="42" rx="6" fill="#0D1117" stroke="#30363D"/>
    <text x="25" y="122" font-size="11" fill="#7EE787">Doc 2:</text>
    <text x="25" y="138" font-size="11" fill="#C9D1D9">"Deep neural networks..."</text>

    <rect x="15" y="156" width="180" height="42" rx="6" fill="#0D1117" stroke="#30363D"/>
    <text x="25" y="174" font-size="11" fill="#FFA657">User Query:</text>
    <text x="25" y="190" font-size="11" fill="#C9D1D9">"What is deep learning?"</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 250 215 L 290 215" stroke="#58A6FF" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- STEP 2: Tokenization & WordPiece -->
  <g transform="translate(290, 110)">
    <rect width="210" height="210" rx="12" fill="url(#grad1)" stroke="#30363D" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="38" rx="12" fill="#8957E5" fill-opacity="0.15"/>
    <text x="105" y="24" font-size="13" font-weight="600" text-anchor="middle" fill="#BC8CFF">2. SUBWORD TOKENIZER</text>
    
    <text x="20" y="65" font-size="11" fill="#8B949E">Byte-Pair / WordPiece Encoding</text>
    
    <rect x="15" y="80" width="180" height="32" rx="6" fill="#0D1117" stroke="#8957E5" stroke-dasharray="4 2"/>
    <text x="105" y="101" font-size="11" font-family="monospace" text-anchor="middle" fill="#D2A8FF">[101, 7592, 2003, ... 102]</text>
    
    <text x="20" y="135" font-size="11" fill="#8B949E">Special Tokens Injected:</text>
    <text x="30" y="155" font-size="11" fill="#C9D1D9">• [CLS] Sequence Classifier</text>
    <text x="30" y="175" font-size="11" fill="#C9D1D9">• [SEP] Sentence Boundary</text>
    <text x="30" y="195" font-size="11" fill="#8B949E">Attention Mask: [1, 1, 1, 1, 0]</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <path d="M 500 215 L 540 215" stroke="#58A6FF" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- STEP 3: Transformer Encoder Backbone -->
  <g transform="translate(540, 110)">
    <rect width="220" height="210" rx="12" fill="url(#grad1)" stroke="#30363D" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="38" rx="12" fill="#238636" fill-opacity="0.15"/>
    <text x="110" y="24" font-size="13" font-weight="600" text-anchor="middle" fill="#3FB950">3. TRANSFORMER ENCODER</text>
    
    <rect x="15" y="52" width="190" height="30" rx="6" fill="#161B22" stroke="#30363D"/>
    <text x="105" y="72" font-size="11" text-anchor="middle" fill="#C9D1D9">Multi-Head Self-Attention (12x)</text>

    <rect x="15" y="90" width="190" height="30" rx="6" fill="#161B22" stroke="#30363D"/>
    <text x="105" y="110" font-size="11" text-anchor="middle" fill="#C9D1D9">Feed-Forward Dense Layers</text>

    <rect x="15" y="128" width="190" height="30" rx="6" fill="#161B22" stroke="#30363D"/>
    <text x="105" y="148" font-size="11" text-anchor="middle" fill="#C9D1D9">Layer Normalization &amp; Residuals</text>

    <rect x="15" y="166" width="190" height="32" rx="6" fill="#0D1117" stroke="#238636"/>
    <text x="105" y="186" font-size="11" font-weight="600" text-anchor="middle" fill="#7EE787">Contextual Token Matrices</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <path d="M 760 215 L 800 215" stroke="#58A6FF" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- STEP 4: Pooling & Normalization -->
  <g transform="translate(800, 110)">
    <rect width="210" height="210" rx="12" fill="url(#grad1)" stroke="#30363D" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="38" rx="12" fill="#D29922" fill-opacity="0.15"/>
    <text x="105" y="24" font-size="13" font-weight="600" text-anchor="middle" fill="#E3B341">4. POOLING &amp; NORM</text>
    
    <text x="20" y="65" font-size="11" fill="#8B949E">Mean Pooling (Average Token Vectors):</text>
    <rect x="15" y="78" width="180" height="32" rx="6" fill="#0D1117" stroke="#D29922" stroke-dasharray="4 2"/>
    <text x="105" y="99" font-size="11" font-family="monospace" text-anchor="middle" fill="#F0883E">v = Σ(h_i · mask_i) / Σ(mask_i)</text>

    <text x="20" y="135" font-size="11" fill="#8B949E">L2 Unit Normalization:</text>
    <rect x="15" y="148" width="180" height="32" rx="6" fill="#0D1117" stroke="#3FB950"/>
    <text x="105" y="169" font-size="11" font-family="monospace" text-anchor="middle" fill="#7EE787">v_norm = v / ||v||_2</text>
    <text x="105" y="198" font-size="10" text-anchor="middle" fill="#8B949E">||v_norm|| = 1.0 (Unit Hypersphere)</text>
  </g>

  <!-- Connector 4 -> 5 -->
  <path d="M 1010 215 L 1045 215" stroke="#58A6FF" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- STEP 5: Dense Vector Output -->
  <g transform="translate(1045, 110)">
    <rect width="115" height="210" rx="12" fill="url(#grad1)" stroke="#30363D" stroke-width="1.5"/>
    <rect x="0" y="0" width="115" height="38" rx="12" fill="#F778BA" fill-opacity="0.15"/>
    <text x="57" y="24" font-size="12" font-weight="600" text-anchor="middle" fill="#F778BA">5. DENSE</text>
    
    <text x="57" y="65" font-size="10" text-anchor="middle" fill="#8B949E">384d / 1536d</text>
    <rect x="12" y="78" width="91" height="110" rx="6" fill="#0D1117" stroke="#F778BA"/>
    <text x="57" y="98" font-size="10" font-family="monospace" text-anchor="middle" fill="#C9D1D9">[ 0.042,</text>
    <text x="57" y="116" font-size="10" font-family="monospace" text-anchor="middle" fill="#C9D1D9">-0.015,</text>
    <text x="57" y="134" font-size="10" font-family="monospace" text-anchor="middle" fill="#8B949E">  ...   ,</text>
    <text x="57" y="152" font-size="10" font-family="monospace" text-anchor="middle" fill="#C9D1D9"> 0.088,</text>
    <text x="57" y="170" font-size="10" font-family="monospace" text-anchor="middle" fill="#7EE787"> 0.012 ]</text>
  </g>

  <!-- LOWER SECTION: GEOMETRIC VECTOR SPACE & SIMILARITY SEARCH -->
  <g transform="translate(40, 360)">
    <rect width="1120" height="280" rx="12" fill="url(#grad1)" stroke="#30363D" stroke-width="1.5"/>
    <rect x="0" y="0" width="1120" height="38" rx="12" fill="#58A6FF" fill-opacity="0.1"/>
    <text x="560" y="25" font-size="14" font-weight="700" text-anchor="middle" fill="#58A6FF" letter-spacing="0.5">HIGH-DIMENSIONAL VECTOR SPACE &amp; SIMILARITY METRICS</text>

    <!-- Sub-panel 1: Geometric Hypersphere -->
    <g transform="translate(30, 55)">
      <rect width="320" height="200" rx="8" fill="#0D1117" stroke="#30363D"/>
      <text x="160" y="24" font-size="12" font-weight="600" text-anchor="middle" fill="#58A6FF">Angle &amp; Cosine Metric (θ)</text>
      
      <!-- Coordinate lines -->
      <line x1="40" y1="170" x2="280" y2="170" stroke="#30363D" stroke-width="1"/>
      <line x1="40" y1="170" x2="40" y2="45" stroke="#30363D" stroke-width="1"/>
      
      <!-- Vector Q (Query) -->
      <line x1="40" y1="170" x2="220" y2="70" stroke="#FFA657" stroke-width="2.5" marker-end="url(#arrow)"/>
      <text x="230" y="65" font-size="11" font-weight="600" fill="#FFA657">Q (Query: "Deep Learning")</text>

      <!-- Vector D1 (Semantic match) -->
      <line x1="40" y1="170" x2="245" y2="95" stroke="#3FB950" stroke-width="2.5" marker-end="url(#arrow-green)"/>
      <text x="250" y="105" font-size="11" font-weight="600" fill="#3FB950">D1 ("Neural Networks")</text>

      <!-- Vector D2 (Different topic) -->
      <line x1="40" y1="170" x2="110" y2="55" stroke="#F85149" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="115" y="50" font-size="10" fill="#F85149">D2 ("Automobile Engine")</text>
      
      <!-- Small arc for angle theta -->
      <path d="M 120 125 A 70 70 0 0 1 135 137" stroke="#E3B341" stroke-width="2" fill="none"/>
      <text x="145" y="130" font-size="11" font-weight="600" fill="#E3B341">θ ≈ 12°</text>
      <text x="160" y="188" font-size="11" text-anchor="middle" fill="#8B949E">cos(θ) = 0.978 (High Semantic Similarity)</text>
    </g>

    <!-- Sub-panel 2: Metric Formulas Comparison -->
    <g transform="translate(380, 55)">
      <rect width="360" height="200" rx="8" fill="#0D1117" stroke="#30363D"/>
      <text x="180" y="24" font-size="12" font-weight="600" text-anchor="middle" fill="#BC8CFF">Mathematical Distance Formulas</text>

      <rect x="15" y="40" width="330" height="42" rx="6" fill="#161B22" stroke="#30363D"/>
      <text x="25" y="58" font-size="11" font-weight="600" fill="#7EE787">Cosine Similarity:</text>
      <text x="25" y="74" font-size="11" font-family="monospace" fill="#C9D1D9">cos(θ) = (u · v) / (||u|| ||v||)  [-1.0 to +1.0]</text>

      <rect x="15" y="90" width="330" height="42" rx="6" fill="#161B22" stroke="#30363D"/>
      <text x="25" y="108" font-size="11" font-weight="600" fill="#58A6FF">Dot Product (Inner Product):</text>
      <text x="25" y="124" font-size="11" font-family="monospace" fill="#C9D1D9">u · v = Σ (u_i · v_i)             [-∞ to +∞]</text>

      <rect x="15" y="140" width="330" height="46" rx="6" fill="#161B22" stroke="#30363D"/>
      <text x="25" y="158" font-size="11" font-weight="600" fill="#E3B341">Euclidean Distance (L2):</text>
      <text x="25" y="174" font-size="11" font-family="monospace" fill="#C9D1D9">d(u,v) = sqrt( Σ (u_i - v_i)^2 )  [0 to +∞]</text>
    </g>

    <!-- Sub-panel 3: MRL & Production Features -->
    <g transform="translate(770, 55)">
      <rect width="320" height="200" rx="8" fill="#0D1117" stroke="#30363D"/>
      <text x="160" y="24" font-size="12" font-weight="600" text-anchor="middle" fill="#3FB950">Matryoshka Embeddings (MRL)</text>

      <text x="20" y="55" font-size="11" fill="#8B949E">Nested Dimension Truncation:</text>
      
      <!-- Full Vector -->
      <rect x="20" y="70" width="280" height="24" rx="4" fill="#1F6FEB" fill-opacity="0.3" stroke="#1F6FEB"/>
      <text x="160" y="86" font-size="10" font-weight="600" text-anchor="middle" fill="#58A6FF">Full 1536-dim Embedding Vector (100% Signal)</text>

      <!-- 512 Vector -->
      <rect x="20" y="104" width="180" height="24" rx="4" fill="#8957E5" fill-opacity="0.3" stroke="#8957E5"/>
      <text x="110" y="120" font-size="10" font-weight="600" text-anchor="middle" fill="#D2A8FF">512-dim (98.7% Signal, 3x Storage Cut)</text>

      <!-- 256 Vector -->
      <rect x="20" y="138" width="100" height="24" rx="4" fill="#238636" fill-opacity="0.3" stroke="#238636"/>
      <text x="70" y="154" font-size="10" font-weight="600" text-anchor="middle" fill="#7EE787">256-dim (95% Signal)</text>

      <text x="20" y="185" font-size="10" fill="#8B949E">• Sub-vector slices retain semantic order</text>
    </g>
  </g>
</svg>
